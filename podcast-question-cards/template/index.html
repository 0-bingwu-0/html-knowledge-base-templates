<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{episode_title}}</title>

  <style>
    :root {
      --bg: #fafaf7;
      --paper: #ffffff;
      --rule: rgba(24, 24, 27, 0.09);
      --rule-soft: rgba(24, 24, 27, 0.05);
      --text: #18181b;
      --text-soft: #3f3f46;
      --muted: #71717a;
      --muted-soft: #a1a1aa;
      --accent: #b45309;
      --accent-soft: rgba(180, 83, 9, 0.08);
      --quote-bg: #f5f5f0;
      --quote-text: #52525b;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 88px 24px 140px;
    }

    /* ── Header ────────────────────────────── */
    .episode-header {
      margin-bottom: 72px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--accent);
    }

    .episode-header h1 {
      margin: 0 0 32px;
      font-size: 42px;
      line-height: 1.15;
      letter-spacing: -0.032em;
      font-weight: 600;
      color: var(--text);
    }

    .episode-meta {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .episode-meta li {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .episode-meta li + li::before {
      content: "";
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--muted-soft);
    }

    .episode-meta a {
      color: var(--text-soft);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
      transition: all 0.2s ease;
    }

    .episode-meta a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .section-label {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 8px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }

    .section-label .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
    }

    .section-label .count {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }

    /* ── Q&A as list ───────────────────────── */
    .qa-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .qa-item {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 0;
      padding: 32px 0;
      border-bottom: 1px solid var(--rule);
      counter-increment: qitem;
      position: relative;
    }

    .qa-list { counter-reset: qitem; }

    .qa-item:last-child {
      border-bottom: none;
    }

    .qa-num {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted-soft);
      font-variant-numeric: tabular-nums;
      padding-top: 7px;
      transition: color 0.25s ease;
    }

    .qa-num::before {
      content: counter(qitem, decimal-leading-zero);
    }

    .qa-item:hover .qa-num {
      color: var(--accent);
    }

    .qa-body {
      min-width: 0;
    }

    .qa-summary {
      list-style: none;
      cursor: pointer;
      display: block;
    }

    .qa-summary::-webkit-details-marker {
      display: none;
    }

    .qa-header-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }

    .qa-question {
      margin: 0;
      flex: 1;
      font-size: 20px;
      line-height: 1.45;
      letter-spacing: -0.015em;
      font-weight: 600;
      color: var(--text);
    }

    .qa-answer {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--text-soft);
      font-weight: 400;
    }

    /* Prevent blue selection highlight when toggling */
    .qa-summary {
      -webkit-tap-highlight-color: transparent;
    }

    .qa-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      transition: all 0.2s ease;
      user-select: none;
      position: relative;
    }

    /* horizontal line of "+" */
    .qa-toggle::before {
      content: "";
      width: 9px;
      height: 1.4px;
      background: currentColor;
      border-radius: 1px;
    }

    /* vertical line of "+" — hidden when open */
    .qa-toggle::after {
      content: "";
      position: absolute;
      width: 1.4px;
      height: 9px;
      background: currentColor;
      border-radius: 1px;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    details[open] .qa-toggle::after {
      transform: scaleY(0);
      opacity: 0;
    }

    .qa-summary:hover .qa-toggle {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    details[open] .qa-toggle {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    blockquote {
      margin: 22px 0 0;
      padding: 22px 24px 22px 26px;
      border-left: 2px solid var(--accent);
      background: var(--quote-bg);
      border-radius: 2px 10px 10px 2px;
      color: var(--quote-text);
      font-size: 14px;
      line-height: 1.78;
      white-space: pre-wrap;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* Selection */
    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    /* Entrance animation */
    .episode-header,
    .section-label,
    .qa-item {
      animation: fadeUp 0.55s ease backwards;
    }

    .episode-header { animation-delay: 0s; }
    .section-label { animation-delay: 0.08s; }
    .qa-item:nth-child(1) { animation-delay: 0.12s; }
    .qa-item:nth-child(2) { animation-delay: 0.16s; }
    .qa-item:nth-child(3) { animation-delay: 0.2s; }
    .qa-item:nth-child(4) { animation-delay: 0.24s; }
    .qa-item:nth-child(5) { animation-delay: 0.28s; }
    .qa-item:nth-child(6) { animation-delay: 0.32s; }
    .qa-item:nth-child(n+7) { animation-delay: 0.36s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      main {
        padding: 56px 20px 96px;
      }

      .episode-header {
        margin-bottom: 48px;
      }

      .episode-header h1 {
        font-size: 28px;
      }

      .episode-meta {
        flex-direction: column;
        gap: 6px;
      }

      .episode-meta li + li::before {
        display: none;
      }

      .qa-item {
        grid-template-columns: 36px 1fr;
        padding: 24px 0;
      }

      .qa-question {
        font-size: 17px;
      }

      .qa-answer {
        font-size: 14.5px;
      }

      blockquote {
        padding: 18px 18px 18px 20px;
        font-size: 13.5px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="episode-header">
      <div class="eyebrow">{{source}}</div>
      <h1>{{episode_title}}</h1>

      <ul class="episode-meta">
        <li>{{guest}}</li>
        <li>{{published_date}}</li>
        <li><a href="{{url}}">{{url_display}}</a></li>
      </ul>
    </header>

    <div class="section-label">
      <span class="title">Q&amp;A Notes</span>
      <span class="count">{{card_count}} questions</span>
    </div>

    <ol class="qa-list">
{{cards}}
    </ol>
  </main>
</body>
</html>
